[project]
name = "nevis-search"
version = "1.0.0"
description = "Search API across advisor clients and their documents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20",
    "anthropic>=2.3",
    "fastapi>=0.162",
    "fastembed>=0.9",
    "numpy>=2.5",
    "pgvector>=0.5",
    "psycopg[binary]>=3.3",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.16",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
launch = "nevis_search.app:launch"
seed = "nevis_search.seed:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.2",
    "ruff>=0.17",
    "testcontainers[postgres,redis]>=4.15",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "TC"]

[tool.mypy]
strict = true
enable_error_code = ["deprecated"]
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
